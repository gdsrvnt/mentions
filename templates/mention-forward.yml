name: mention-forward

# Forwards selected GitHub events to a webhook when the trigger user mentions the bot.
#
# Surfaces covered: issues, issue_comment, pull_request, pull_request_review,
# pull_request_review_comment, discussion, discussion_comment.
#
# Pull request opened and edited events are subscribed as pull_request_target so
# the workflow file and repository secrets come from the default branch. This job
# never checks out repository code and never runs pull request contents.
#
# commit_comment is not an Actions trigger. actionlint rejects a workflow that
# subscribes to it.
#
# Actions == and contains() are case-insensitive. The first shell step applies
# a boundary so @bot does not match @bot2. Edits are delivered again. The handler
# drops a repeat of the same node id and updated_at.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: >-
      github.actor == '__MENTIONS_TRIGGER_USER__' && (
        (github.event_name == 'issues' && (contains(github.event.issue.body || '', '@__MENTIONS_BOT_HANDLE__') || contains(github.event.issue.title || '', '@__MENTIONS_BOT_HANDLE__'))) ||
        (github.event_name == 'pull_request_target' && (contains(github.event.pull_request.body || '', '@__MENTIONS_BOT_HANDLE__') || contains(github.event.pull_request.title || '', '@__MENTIONS_BOT_HANDLE__'))) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body || '', '@__MENTIONS_BOT_HANDLE__')) ||
        (github.event_name == 'discussion' && (contains(github.event.discussion.body || '', '@__MENTIONS_BOT_HANDLE__') || contains(github.event.discussion.title || '', '@__MENTIONS_BOT_HANDLE__'))) ||
        ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' || github.event_name == 'discussion_comment') && contains(github.event.comment.body || '', '@__MENTIONS_BOT_HANDLE__'))
      )
    steps:
      - name: Forward event to webhook
        env:
          EVENT_NAME: ${{ github.event_name }}
          WEBHOOK_URL: ${{ secrets.__MENTIONS_SECRET_URL__ }}
          WEBHOOK_KEY: ${{ secrets.__MENTIONS_SECRET_KEY__ }}
          WEBHOOK_HEADER: ${{ secrets.__MENTIONS_SECRET_HEADER__ }}
        run: |
          # mentions-forward-script
          set -euo pipefail
          text="$(jq -r '
            def s: if . == null then "" else . end;
            if (.comment.body != null) then .comment.body
            elif (.review.body != null) then .review.body
            elif (.issue != null) then ((.issue.title | s) + "\n" + (.issue.body | s))
            elif (.pull_request != null) then ((.pull_request.title | s) + "\n" + (.pull_request.body | s))
            elif (.discussion != null) then ((.discussion.title | s) + "\n" + (.discussion.body | s))
            else ""
            end
          ' "$GITHUB_EVENT_PATH")"
          handle="__MENTIONS_BOT_HANDLE__"
          if ! printf '%s' "$text" | grep -Eiq "(^|[^[:alnum:]_-])@${handle}([^[:alnum:]_-]|$)"; then
            echo "::notice::Mention boundary check failed for @${handle}"
            exit 0
          fi
          work="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          if [ -z "${WEBHOOK_URL:-}" ] || [ -z "${WEBHOOK_HEADER:-}" ]; then
            case "$EVENT_NAME" in
              pull_request_review|pull_request_review_comment)
                echo "::notice::Fork reviews are not forwarded because Actions secrets are unavailable"
                exit 0
                ;;
              *)
                echo "::error::__MENTIONS_SECRET_URL__ and __MENTIONS_SECRET_HEADER__ must be set"
                exit 1
                ;;
            esac
          fi
          # __MENTIONS_SECRET_HEADER__ may be the full header line ("Authorization: Bearer <key>"), as the routine panel shows it.
          case "$WEBHOOK_HEADER" in
            *:*) auth_header="$WEBHOOK_HEADER" ;;
            *)
              if [ -z "${WEBHOOK_KEY:-}" ]; then
                echo "::error::__MENTIONS_SECRET_KEY__ must be set when __MENTIONS_SECRET_HEADER__ is only a header name"
                exit 1
              fi
              auth_header="${WEBHOOK_HEADER}: ${WEBHOOK_KEY}" ;;
          esac
          jq -n --arg event_name "$EVENT_NAME" --slurpfile payload "$GITHUB_EVENT_PATH" \
            '{event_name: $event_name, payload: $payload[0]}' > "${work}/body.json"
          http_code="$(curl -sS -o "${work}/webhook-response.txt" -w '%{http_code}' -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "$auth_header" \
            --data-binary "@${work}/body.json")"
          case "$http_code" in
            2[0-9][0-9]) ;;
            *)
              echo "::error::webhook returned HTTP ${http_code}"
              exit 1
              ;;
          esac
          echo "webhook HTTP ${http_code}"
          # end mentions-forward-script
