name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck scripts/install.sh scripts/test.sh

      - name: Install actionlint
        run: |
          set -euo pipefail
          version="1.7.12"
          checksum="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          archive="/tmp/actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${checksum}  ${archive}" | sha256sum -c -
          sudo tar -C /usr/local/bin -xzf "$archive" actionlint
          actionlint -version

      - name: actionlint
        run: actionlint

      - name: Tests
        run: bash scripts/test.sh

      - name: Validate plugin manifest
        run: node scripts/validate-plugin.mjs
